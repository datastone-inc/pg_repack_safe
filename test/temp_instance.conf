# @file temp_instance.conf
# @brief Server settings for the temporary instances the test suites run on.
#
# pg_regress and pg_isolation_regress append this file to their temporary
# instance's postgresql.conf (--temp-config). The reader guard needs the
# library loaded in every backend before the first query, which only
# shared_preload_libraries provides, and REPACK (CONCURRENTLY) is refused
# without it. REPACK (CONCURRENTLY) needs
# wal_level = replica or higher; it is set here so the tests do not depend
# on the initdb default.

shared_preload_libraries = 'pg_repack_safe'
wal_level = replica
# Autovacuum workers hold snapshots of their own, which would make queries on
# pg_stat_activity's backend_xmin (doc_examples) depend on timing.
autovacuum = off
