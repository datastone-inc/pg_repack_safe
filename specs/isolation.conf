# @file isolation.conf
# @brief Server settings for the temporary instance the isolation specs run on.
#
# pg_isolation_regress appends this file to the temporary instance's
# postgresql.conf (--temp-config). The reader guard needs the library loaded
# in every backend before the first query, which only
# shared_preload_libraries provides. REPACK (CONCURRENTLY) needs
# wal_level = replica or higher; it is set here so the specs do not depend
# on the initdb default.

shared_preload_libraries = 'pg_repack_safe'
wal_level = replica
